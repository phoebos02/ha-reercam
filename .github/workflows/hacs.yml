name: HACS

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Remove this once brand assets have been added.
          ignore: brands
