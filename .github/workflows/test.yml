name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Run API check
        run: python3 tests/test_api.py

  scaffold:
    name: Integration scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Run scaffold check
        run: python3 tests/test_scaffold.py
